# Pages générées par update.sh depuis l'inventaire des visuels : liées depuis
# technicien/visuels/index.md mais volontairement absentes de la navigation.
not_in_nav: |
  /technicien/visuels/categories/

theme:
 name: material
 logo: https://static.abls-habitat.fr/img/abls.svg
 language: fr
 features:
  - navigation.instant
  - navigation.tabs
  - navigation.tracking
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - toc.follow
  - content.code.copy
  - search.suggest
  - search.share
 palette: # (1)!
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      primary: indigo
      scheme: default
      toggle:
        icon: material/brightness-7 # (2)!
        name: Switch to dark mode

extra:
  social:
    - icon: fontawesome/brands/github # (1)!
      link: https://github.com/sebaru

plugins:
  - git-revision-date-localized:
      type: datetime
      enable_creation_date: true
      enable_git_follow: false
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
